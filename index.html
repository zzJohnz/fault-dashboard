<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>维修计划辅助决策看板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5;
         color: #2c2c2a; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: #1f2d3d; color: #fff; padding: 14px 20px;
            font-size: 18px; font-weight: 600; letter-spacing: 1px; }
  .board { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px;
          box-shadow: 0 6px 24px rgba(0,0,0,.06); padding: 64px 72px; text-align: center; }
  .card .icon { font-size: 54px; margin-bottom: 18px; }
  .card .msg { font-size: 26px; font-weight: 600; color: #3b6d11; }
  .card .sub { margin-top: 14px; font-size: 14px; color: #888780; }
</style>
</head>
<body>
  <div class="topbar">维修计划辅助决策看板</div>
  <div class="board">
    <div class="card">
      <div class="icon">📋</div>
      <div class="msg">请通过内网查看</div>
      <div class="sub">本看板已迁移至公司内网，请使用内网环境访问</div>
    </div>
  </div>
</body>
</html>
